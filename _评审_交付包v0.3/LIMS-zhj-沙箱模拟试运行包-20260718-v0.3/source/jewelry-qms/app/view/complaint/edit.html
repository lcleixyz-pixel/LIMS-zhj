<div class="card">
    <div class="card-header"><h5 class="mb-0">编辑投诉 {$record.complaint_number}</h5></div>
    <div class="card-body">
        <form method="post" action="/complaint/edit?id={$record.id}">
            <div class="row">
                <div class="col-md-6 mb-3"><label class="required">投诉编号</label><input name="complaint_number" class="form-control" value="{$record.complaint_number}" required></div>
                <div class="col-md-6 mb-3"><label class="required">受理日期</label><input type="date" name="received_date" class="form-control" value="{$record.received_date}" required></div>
                <div class="col-md-6 mb-3"><label class="required">客户名称</label><input name="customer_name" class="form-control" value="{$record.customer_name}" required></div>
                <div class="col-md-6 mb-3"><label>联系方式</label><input name="contact" class="form-control" value="{$record.contact|default=''}"></div>
                <div class="col-md-6 mb-3"><label>关联报告编号</label><input name="report_number" class="form-control" value="{$record.report_number|default=''}"></div>
                <div class="col-md-6 mb-3"><label>责任人</label><select name="assigned_to" class="form-select"><option value="">请选择</option>{volist name="users" id="user"}<option value="{$user.id}" {if $record.assigned_to == $user.id}selected{/if}>{$user.name}</option>{/volist}</select></div>
                <div class="col-md-6 mb-3"><label>处理期限</label><input type="date" name="due_date" class="form-control" value="{$record.due_date|default=''}"></div>
                <div class="col-12 mb-3"><label class="required">投诉内容</label><textarea name="description" class="form-control" rows="4" required>{$record.description}</textarea></div>
            </div>
            <div class="alert alert-light border">调查、处理、反馈和状态只能在“推进处理”中修改，本页不会覆盖这些内容。</div>
            <div class="text-end">
                <a href="/complaint/view?id={$record.id}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">更新</button>
            </div>
        </form>
    </div>
</div>
