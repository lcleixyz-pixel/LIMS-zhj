{__NOLAYOUT__}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 珠宝检测实验室 QMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/qms.css" rel="stylesheet">
    <style>
        :root{
            --qms-primary:#1e3a5f;
            --qms-primary-2:#2c5282;
            --qms-primary-dark:#163050;
            --qms-ink:#2d3748;
            --qms-ink-2:#718096;
            --qms-line:#e2e8f0;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
            background:linear-gradient(135deg,#1e3a5f 0%,#163050 55%,#0f2238 100%);
            color:var(--qms-ink);
        }
        .login-card{
            width:100%;
            max-width:400px;
            background:#fff;
            border-radius:8px;
            box-shadow:0 12px 40px rgba(0,0,0,.22);
            overflow:hidden;
        }
        .environment-banner{
            padding:10px 16px;
            text-align:center;
            background:#fff3cd;
            color:#664d03;
            border-bottom:1px solid #ffecb5;
            font-size:12px;
            line-height:1.5;
        }
        .environment-banner strong,
        .environment-banner span{ display:block; }
        .login-brand{
            padding:36px 32px 24px;
            text-align:center;
            border-bottom:1px solid var(--qms-line);
        }
        .login-logo{
            width:56px;
            height:56px;
            margin:0 auto 16px;
            border-radius:12px;
            background:var(--qms-primary);
            color:#fff;
            font-weight:700;
            font-size:22px;
            letter-spacing:1px;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 4px 12px rgba(30,58,95,.25);
        }
        .login-brand h1{
            font-size:19px;
            font-weight:600;
            color:var(--qms-primary);
            margin:0 0 4px;
            letter-spacing:.3px;
        }
        .login-brand p{
            font-size:12px;
            color:var(--qms-ink-2);
            margin:0;
            letter-spacing:.5px;
        }
        .login-body{ padding:28px 32px 32px; }
        .login-alert{
            background:#fde8e8;
            color:#c53030;
            border-radius:5px;
            padding:10px 14px;
            font-size:13px;
            margin-bottom:18px;
            border:1px solid #f5c6c6;
        }
        .login-form label{
            display:block;
            font-size:12px;
            font-weight:600;
            color:var(--qms-ink-2);
            margin:0 0 6px;
            letter-spacing:.3px;
        }
        .login-form .field{ margin-bottom:18px; }
        .login-form input{
            width:100%;
            padding:11px 14px;
            font-size:14px;
            color:var(--qms-ink);
            background:#fafbfc;
            border:1px solid var(--qms-line);
            border-radius:5px;
            outline:none;
            transition:border-color .15s,box-shadow .15s,background .15s;
        }
        .login-form input::placeholder{ color:#a0aec0; }
        .login-form input:focus{
            background:#fff;
            border-color:var(--qms-primary-2);
            box-shadow:0 0 0 3px rgba(44,82,130,.12);
        }
        .login-btn{
            width:100%;
            padding:12px;
            margin-top:6px;
            background:var(--qms-primary);
            color:#fff;
            border:none;
            border-radius:5px;
            font-size:14px;
            font-weight:600;
            letter-spacing:1px;
            cursor:pointer;
            transition:background .15s;
        }
        .login-btn:hover{ background:var(--qms-primary-dark); }
        .login-foot{
            margin-top:22px;
            padding-top:18px;
            border-top:1px solid var(--qms-line);
            text-align:center;
            font-size:12px;
            color:var(--qms-ink-2);
            line-height:1.6;
        }
        .login-foot a{ color:var(--qms-primary-2); text-decoration:none; }
        @media (max-width:480px){
            .login-brand{ padding:28px 24px 18px; }
            .login-body{ padding:22px 24px 26px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        {if !empty($environmentLabel)}
        <div class="environment-banner" role="alert">
            <strong>{$environmentLabel}</strong>
            <span>{$environmentNotice|default='禁止录入正式业务数据、客户资料或其他敏感信息'}</span>
        </div>
        {/if}
        <div class="login-brand">
            <div class="login-logo">QC</div>
            <h1>珠宝检测实验室 QMS</h1>
            <p>CMA / CNAS 质量管理系统</p>
        </div>
        <div class="login-body">
            {if !empty($error)}
            <div class="login-alert">{$error}</div>
            {elseif session('error')}
            <div class="login-alert">{$Think.session.error}</div>
            {/if}
            <form method="post" action="/login/index" class="login-form">
                <div class="field">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>
            <div class="login-foot">
                首次登录或忘记密码，请联系系统管理员<br>
                <a href="/login/changePassword">修改密码</a>
            </div>
        </div>
    </div>
</body>
</html>
