<div class="card">
    <div class="card-header"><h5 class="mb-0">新增期间核查计划</h5></div>
    <div class="card-body">
        <div class="alert {if $tableReady}alert-info{else}alert-warning{/if} py-2">{$mechanismNotice}</div>
        <form method="post" action="/equipment_period_check/add">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label required" for="periodCheckEquipment">设备</label>
                    <select name="equipment_id" class="form-select" id="periodCheckEquipment" required {if !$tableReady}disabled{/if}>
                        <option value="">请选择设备</option>
                        {volist name="equipments" id="equipment"}
                        <option value="{$equipment.id}" {if $form.equipment_id == $equipment.id}selected{/if}>{$equipment.equipment_number} {$equipment.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label required" for="periodCheckDate">计划日期</label>
                    <input type="date" name="plan_date" id="periodCheckDate" class="form-control" value="{$form.plan_date|default=''}" required {if !$tableReady}disabled{/if}>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label" for="periodCheckNote">备注</label>
                    <textarea name="note" id="periodCheckNote" class="form-control" rows="3" {if !$tableReady}disabled{/if}>{$form.note|default=''}</textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" {if !$tableReady}disabled{/if}>保存计划</button>
            <a href="/equipment_period_check/index" class="btn btn-outline-secondary">返回</a>
        </form>
    </div>
</div>
