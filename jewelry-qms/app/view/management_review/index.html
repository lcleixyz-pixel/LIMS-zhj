<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">管理评审</h5>
        <a href="/management_review/add" class="btn btn-primary btn-sm">新增</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm">
                <thead>
                    <tr>
                        <th>评审编号</th>
                        <th>评审日期</th>
                        <th>主题</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {volist name="items" id="item"}
                    <tr>
                        <td>{$item.review_number|default='-'}</td>
                        <td>{$item.review_date|default='-'}</td>
                        <td>{$item.title|default='-'}</td>
                        <td>{:qms_status_label('management_review', $item.status)}</td>
                        <td>
                            <a href="/management_review/view?id={$item.id}" class="btn btn-sm btn-outline-info">查看</a>
                            <a href="/management_review/edit?id={$item.id}" class="btn btn-sm btn-outline-primary">编辑</a>
                        </td>
                    </tr>
                    {/volist}
                    {empty name="items"}
                    <tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>
                    {/empty}
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination pagination-sm justify-content-center">
                {$pages|raw}
            </ul>
        </nav>
    </div>
</div>
