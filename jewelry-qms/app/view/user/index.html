<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">用户管理</h5>
        <a href="/user/add" class="btn btn-primary btn-sm">新增</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm">
                <thead>
                    <tr>
                        <th>用户名</th>
                        <th>姓名</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>最近登录</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {volist name="items" id="item"}
                    <tr>
                        <td>{$item.username}</td>
                        <td>{$item.name}</td>
                        <td>{$roles[$item.role]|default=$item.role}</td>
                        <td>
                            {if $item.publish}<span class="badge bg-success">启用</span>{else}<span class="badge bg-secondary">停用</span>{/if}
                        </td>
                        <td>{$item.last_login|default='从未登录'}</td>
                        <td>
                            <a href="/user/view?id={$item.id}" class="btn btn-sm btn-outline-info">查看</a>
                            <a href="/user/changePassword?id={$item.id}" class="btn btn-sm btn-outline-warning">重置密码</a>
                            <a href="/user/delete?id={$item.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('确认删除此记录？删除后无法恢复。')">删除</a>
                        </td>
                    </tr>
                    {/volist}
                    {empty name="items"}
                    <tr><td colspan="6"><div class="qms-empty-state">尚无系统用户。点击右上角“新增”建立账号。</div></td></tr>
                    {/empty}
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination pagination-sm justify-content-center">
                {$pages|raw}
            </ul>
        </nav>
    </div>
</div>
