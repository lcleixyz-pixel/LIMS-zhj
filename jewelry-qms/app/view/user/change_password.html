<div class="card">
    <div class="card-header"><h5 class="mb-0">修改密码</h5></div>
    <div class="card-body">
        {if !empty($forced)}
        <div class="alert alert-warning">首次登录或管理员重置后，必须修改密码后才能继续使用系统。</div>
        {/if}
        {if !empty($error)}
        <div class="alert alert-danger">{$error}</div>
        {/if}
        <form method="post" action="/user/changePassword">
            <div class="mb-3">
                <label class="form-label required">当前密码</label>
                <input type="password" name="old_password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label required">新密码</label>
                <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label required">确认新密码</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">确认修改</button>
        </form>
    </div>
</div>
