<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">能力确认详情</h5>
        <div>
            <a href="/competency_record/edit?id={$record.id}" class="btn btn-sm btn-outline-primary">编辑</a>
            <a href="/competency_record/index" class="btn btn-sm btn-outline-secondary">返回列表</a>
        </div>
    </div>
    <div class="card-body">
        <table class="table table-bordered">
            {volist name="fields" id="field"}
            <tr><th width="150">{$field.label}</th><td>{$field.value|default='-'}</td></tr>
            {/volist}
        </table>
    </div>
</div>
