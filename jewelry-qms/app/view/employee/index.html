<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">员工管理</h5>
        <a href="/employee/add" class="btn btn-primary btn-sm">新增</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm">
                <thead>
                    <tr>
                        <th>工号</th>
                        <th>姓名</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {volist name="items" id="item"}
                    <tr>
                        <td>{$item.employee_number|default='未设置'}</td>
                        <td>{$item.name}</td>
                        <td>
                            {if $item.publish}<span class="badge bg-success">在册</span>{else}<span class="badge bg-secondary">停用</span>{/if}
                        </td>
                        <td>{$item.created|default='-'}</td>
                        <td>
                            <a href="/employee/view?id={$item.id}" class="btn btn-sm btn-outline-info">查看</a>
                            <a href="/employee/edit?id={$item.id}" class="btn btn-sm btn-outline-primary">编辑</a>
                            <a href="/employee/delete?id={$item.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('确认删除此记录？删除后无法恢复。')">删除</a>
                        </td>
                    </tr>
                    {/volist}
                    {empty name="items"}
                    <tr><td colspan="5"><div class="qms-empty-state">尚无员工档案。点击右上角“新增”开始登记。</div></td></tr>
                    {/empty}
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination pagination-sm justify-content-center">
                {$pages|raw}
            </ul>
        </nav>
    </div>
</div>
