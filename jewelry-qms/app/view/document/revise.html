<div class="card">
    <div class="card-header">
        <h5 class="mb-0">修订文件 - {$record.doc_number|default=''}</h5>
    </div>
    <div class="card-body">
        <div class="alert alert-info">
            <strong>当前文件信息：</strong><br>
            编号：{$record.doc_number|default=''}　标题：{$record.title|default=''}<br>
            当前版本：<strong>{$record.version|default='1.0'}</strong>　→　拟生成版本：<strong>{$nextVersion|default='下一修订版'}</strong>
            <div class="small mt-2">旧版本将完整保留；新版本先进入草稿，修改完成后仍需重新履行审核、批准和试运行确认。</div>
        </div>
        <form method="post" action="/document/revise?id={$record.id}" enctype="multipart/form-data">
            <input type="hidden" name="id" value="{$record.id}">
            <div class="mb-3">
                <label for="change_reason" class="form-label required">本次修改了什么，为什么修改</label>
                <textarea class="form-control" id="change_reason" name="change_reason" rows="4" required placeholder="例如：依据冲突审查结果，修正第 5.2 条责任岗位，并补充对应记录表格。"></textarea>
            </div>
            <div class="mb-3">
                <label for="document_file" class="form-label">上传新版本附件</label>
                <input type="file" class="form-control" id="document_file" name="document_file">
                <small class="text-muted">如不上传新附件，将保留原附件；修订后将同步结构化文件并进入草稿复核。</small>
            </div>
            <div class="text-end">
                <a href="/document/view?id={$record.id}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">建立修订草稿</button>
            </div>
        </form>
    </div>
</div>
