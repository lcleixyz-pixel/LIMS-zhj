<div class="card">
    <div class="card-header"><h5 class="mb-0">编辑不符合 {$record.nc_number}</h5></div>
    <div class="card-body">
        <form method="post" action="/nonconformity/edit?id={$record.id}">
            <div class="row">
                <div class="col-md-6 mb-3"><label>编号</label><input name="nc_number" class="form-control" value="{$record.nc_number}"></div>
                <div class="col-md-6 mb-3"><label class="required">发现日期</label><input type="date" name="identified_date" class="form-control" value="{$record.identified_date}" required></div>
                <div class="col-md-6 mb-3"><label class="required">来源</label><select name="source" class="form-select" required>{foreach $sourceOptions as $key=>$label}<option value="{$key}" {if $record.source == $key}selected{/if}>{$label}</option>{/foreach}</select></div>
                <div class="col-md-6 mb-3"><label class="required">严重程度</label><select name="severity" class="form-select" required>{foreach $severityOptions as $key=>$label}<option value="{$key}" {if $record.severity == $key}selected{/if}>{$label}</option>{/foreach}</select></div>
                <div class="col-md-6 mb-3"><label>处置决定</label><select name="disposition" class="form-select"><option value="">待评估</option>{foreach $dispositionOptions as $key=>$label}<option value="{$key}" {if $record.disposition == $key}selected{/if}>{$label}</option>{/foreach}</select></div>
                <div class="col-md-6 mb-3"><label>报告编号</label><input name="report_number" class="form-control" value="{$record.report_number|default=''}"></div>
                <div class="col-md-6 mb-3"><label>责任人</label><select name="assigned_to" class="form-select"><option value="">请选择</option>{volist name="users" id="user"}<option value="{$user.id}" {if $record.assigned_to == $user.id}selected{/if}>{$user.name}</option>{/volist}</select></div>
                <div class="col-12 mb-3"><label class="required">不符合描述</label><textarea name="description" class="form-control" rows="4" required>{$record.description}</textarea></div>
                <div class="col-12 mb-3"><label>影响评估</label><textarea name="impact_assessment" class="form-control" rows="2">{$record.impact_assessment|default=''}</textarea></div>
                <div class="col-12 mb-3"><label>即时措施</label><textarea name="immediate_action" class="form-control" rows="2">{$record.immediate_action|default=''}</textarea></div>
            </div>
            <div class="alert alert-light border">状态只能通过明确的处置流程变更，本页不会修改当前状态。</div>
            <div class="text-end">
                <a href="/nonconformity/view?id={$record.id}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">更新</button>
            </div>
        </form>
    </div>
</div>
